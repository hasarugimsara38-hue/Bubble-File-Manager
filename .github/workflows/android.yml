name: Build Bubble File Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform scaffold
        run: flutter create --platforms=android --project-name bubble_file_manager .
      - name: Set Bubble File Manager app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          data = path.read_text(encoding="utf-8")
          start = data.lower().find("<application")
          if start < 0:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          end = data.find(">", start)
          if end < 0:
              raise SystemExit("Malformed <application> element")
          tag = data[start:end + 1]
          marker = 'android:label='
          if marker in tag:
              import re
              tag = re.sub(r'android:label="[^"]*"', 'android:label="Bubble File Manager"', tag, count=1)
          else:
              tag = tag[:-1] + ' android:label="Bubble File Manager">'
          data = data[:start] + tag + data[end + 1:]
          path.write_text(data, encoding="utf-8")
          PY
      - name: Add Android storage permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          data = path.read_text()
          permissions = """    <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />
          """
          if "android.permission.MANAGE_EXTERNAL_STORAGE" not in data:
              data = data.replace("<application", permissions + "    <application", 1)
              path.write_text(data)
          PY
      - name: Configure biometric-compatible Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              path = Path(name)
              if path.exists():
                  data = path.read_text()
                  data = data.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                  data = data.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  lines = data.splitlines()
                  changed = 0
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped.startswith("compileSdk ="):
                          lines[i] = line[:len(line)-len(line.lstrip())] + "compileSdk = 36"
                          changed += 1
                      elif stripped.startswith("compileSdkVersion "):
                          lines[i] = line[:len(line)-len(line.lstrip())] + "compileSdkVersion 36"
                          changed += 1
                  if changed == 0:
                      raise SystemExit(f"No compileSdk setting found in {name}")
                  data = "\n".join(lines) + "\n"
                  print(f"Configured {name}: compileSdk 36 ({changed} setting(s))")
                  path.write_text(data)
          PY
      - name: Enable FragmentActivity for biometric authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("android/app/src/main/kotlin").rglob("MainActivity.kt"):
              data = path.read_text()
              data = data.replace("import io.flutter.embedding.android.FlutterActivity", "import io.flutter.embedding.android.FlutterFragmentActivity")
              data = data.replace("class MainActivity: FlutterActivity()", "class MainActivity: FlutterFragmentActivity()")
              data = data.replace("class MainActivity : FlutterActivity()", "class MainActivity : FlutterFragmentActivity()")
              path.write_text(data)
          PY
      - name: Add native storage capacity channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("MainActivity.kt not found")
          for path in files:
              package_line = next((line for line in path.read_text().splitlines() if line.startswith("package ")), None)
              if not package_line:
                  raise SystemExit(f"Package declaration missing in {path}")
              source = f'''{package_line}
          import android.app.ActivityManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.os.storage.StorageManager
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "aqua/storage")
                      .setMethodCallHandler {{ call, result ->
                          try {{
                              when (call.method) {{
                                  "storageInfo" -> {{
                                      val stats = StatFs(Environment.getExternalStorageDirectory().absolutePath)
                                      result.success(mapOf("total" to stats.totalBytes, "free" to stats.availableBytes))
                                  }}
                                  "storageVolumes" -> {{
                                      val storageManager = getSystemService(STORAGE_SERVICE) as StorageManager
                                      val storageVolumes = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {{
                                          storageManager.storageVolumes.mapNotNull {{ volume ->
                                              val directory = volume.directory
                                              val state = volume.state
                                              if (directory == null ||
                                                  (state != Environment.MEDIA_MOUNTED &&
                                                   state != Environment.MEDIA_MOUNTED_READ_ONLY)) {{
                                                  null
                                              }} else {{
                                                  try {{
                                                      val stats = StatFs(directory.absolutePath)
                                                      mapOf(
                                                          "path" to directory.absolutePath,
                                                          "removable" to volume.isRemovable,
                                                          "state" to state,
                                                          "total" to stats.totalBytes,
                                                          "free" to stats.availableBytes
                                                      )
                                                  }} catch (_: Exception) {{
                                                      null
                                                  }}
                                              }}
                                          }}
                                      }} else {{
                                          getExternalFilesDirs(null).filterNotNull().mapNotNull {{ directory ->
                                              val rawPath = directory.absolutePath
                                              val marker = "/Android/data/"
                                              val root = if (rawPath.contains(marker)) rawPath.substringBefore(marker) else rawPath
                                              val state = Environment.getExternalStorageState(directory)
                                              if (state != Environment.MEDIA_MOUNTED && state != Environment.MEDIA_MOUNTED_READ_ONLY) {{
                                                  null
                                              }} else {{
                                                  try {{
                                                      val stats = StatFs(root)
                                                      mapOf(
                                                          "path" to root,
                                                          "removable" to Environment.isExternalStorageRemovable(directory),
                                                          "state" to state,
                                                          "total" to stats.totalBytes,
                                                          "free" to stats.availableBytes
                                                      )
                                                  }} catch (_: Exception) {{
                                                      null
                                                  }}
                                              }}
                                          }}
                                      }}.distinctBy {{ it["path"] }}
                                      result.success(storageVolumes)
                                  }}
                                  "deviceDiagnostics" -> {{
                                      val manager = getSystemService(ACTIVITY_SERVICE) as ActivityManager
                                      val memory = ActivityManager.MemoryInfo()
                                      manager.getMemoryInfo(memory)
                                      val volumes = getExternalFilesDirs(null).filterNotNull().map {{ directory ->
                                          val rawPath = directory.absolutePath
                                          val marker = "/Android/data/"
                                          val root = if (rawPath.contains(marker)) rawPath.substringBefore(marker) else rawPath
                                          mapOf(
                                              "path" to root,
                                              "removable" to Environment.isExternalStorageRemovable(directory),
                                              "state" to Environment.getExternalStorageState(directory)
                                          )
                                      }}
                                      val allFilesAccess = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R)
                                          Environment.isExternalStorageManager() else true
                                      result.success(mapOf(
                                          "sdkInt" to Build.VERSION.SDK_INT,
                                          "allFilesAccess" to allFilesAccess,
                                          "totalRamBytes" to memory.totalMem,
                                          "availableRamBytes" to memory.availMem,
                                          "lowMemory" to memory.lowMemory,
                                          "volumes" to volumes
                                      ))
                                  }}
                                  else -> result.notImplemented()
                              }}
                          }} catch (error: Exception) {{
                              result.error("DEVICE_DIAGNOSTICS_FAILED", error.message, null)
                          }}
                      }}
              }}
          }}
          '''
              path.write_text(source)
              print(f"Installed storage stats channel in {path}")
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Align Android plugin compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = [
              Path.home() / ".pub-cache" / "hosted",
              Path("/opt/hostedtoolcache/flutter"),
          ]
          candidates = []
          for root in roots:
              if root.exists():
                  for path in root.rglob("build.gradle*"):
                      if path.parent.name == "android" and path.parent.parent.name.startswith("file_picker-"):
                          candidates.append(path)
          if not candidates:
              raise SystemExit("file_picker Android Gradle file not found; searched pub cache and Flutter tool cache")
          changed = []
          for gradle in candidates:
              text = gradle.read_text()
              lines = text.splitlines()
              count = 0
              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith(("compileSdkVersion ", "compileSdkVersion=", "compileSdk ", "compileSdk=")):
                      indent = line[:len(line) - len(line.lstrip())]
                      if gradle.name.endswith(".kts"):
                          lines[i] = indent + "compileSdk = 36"
                      else:
                          lines[i] = indent + "compileSdkVersion 36"
                      count += 1
              if count:
                  gradle.write_text("\n".join(lines) + "\n")
                  changed.append(f"{gradle} ({count} setting(s))")
          if not changed:
              for path in candidates:
                  print("Found but no recognized compileSdk declaration:", path)
                  print(path.read_text())
              raise SystemExit("No compileSdk declaration could be patched in file_picker")
          print("Aligned file_picker Android compile SDK:", changed)
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build optimized release APK
        run: flutter build apk --release
      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: bubble-file-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
